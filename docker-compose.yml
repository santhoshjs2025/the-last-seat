services:
  db:
    image: postgres:16-alpine
    container_name: the_last_seat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_last_seat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d the_last_seat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the_last_seat_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/the_last_seat
      ENVIRONMENT: production
      DEBUG: "false"
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 30
      DB_POOL_TIMEOUT: 30
      RESERVATION_EXPIRY_MINUTES: 5
      EXPIRY_WORKER_INTERVAL_SECONDS: 10
      TOTAL_SEATS: 500
      MAX_PAYMENT_SIMULATED_DELAY_SECONDS: 30
      ADMIN_API_KEY: admin-dev-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
